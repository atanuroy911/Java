name: optcd-github-B

'on':
- workflow_dispatch

permissions:
  contents: read

jobs:
  run_infer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6.0.1
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Set up inferAdd commentMore actions
      uses: srz-zumix/setup-infer@v1

    - name: Display infer version
      run: |
        which infer
        infer --version

    - name: 'mvn: go-offline (untimed)'
      run: mvn -B -q dependency:go-offline || true
    - name: 'mvn: Run infer'
      run: |
        mvn clean
        infer --java-version 21 --fail-on-issue  --print-logs --no-progress-bar -- mvn test
