name: Modified Infer
'on':
  - push
  - workflow_dispatch
permissions:
  contents: read
jobs:
  run_infer:
    runs-on:
      - self-hosted
      - optcd
    steps:
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |-
          python -m pip install --upgrade pip
          pip install inotify
      - name: Run inotifywait
        run: |-
          python3 -c "
          import inotify.adapters
          import inotify.constants
          import os
          from datetime import datetime, timezone
          with open('/home/runner/inotifywait-log-run_infer.csv', 'w') as log_file:
            i = inotify.adapters.InotifyTree('/home/runner/work/Java/Java', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
            for event in i.event_gen(yield_nones=False):
              (_, type_names, path, filename) = event
              now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
              events = ','.join(type_names)
              log_file.write(f'{now};{path};{filename};{events}\n')
              log_file.flush()
              os.fsync(log_file.fileno())
          " &
      - uses: actions/checkout@v7
      - run: touch optcd-3.txt
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 21
          distribution: temurin
      - run: touch optcd-4.txt
      - name: Set up inferAdd commentMore actions
        uses: srz-zumix/setup-infer@v1
      - run: touch optcd-5.txt
      - name: Display infer version
        run: |-
          which infer
          infer --version
      - run: touch optcd-6.txt
      - name: Run infer
        run: "mvn clean\ninfer --java-version 21 --fail-on-issue  --print-logs --no-progress-bar
          -- mvn test\n --no-stats -DdisableXmlReport=true -Dmaven.compiler.useIncrementalCompilation=false
          cleaninfer"
      - run: touch optcd-7.txt
      - name: Upload inotifywait logs
        uses: actions/upload-artifact@v4
        with:
          name: inotifywait-run_infer
          path: /home/runner/inotifywait-log-run_infer.csv
    name: run_infer
